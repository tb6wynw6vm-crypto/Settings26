name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid dpkg make
      - name: Get roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
      - name: Get SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/ || cp -R /tmp/sdks/*.sdk $HOME/theos/sdks/
      - name: Build
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: Settings26-deb
          path: packages/*.deb
