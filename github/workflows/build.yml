name: Build tweak

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make xz
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mv /tmp/sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: gmake package FINALPACKAGE=1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Settings26 build ${{ github.run_number }}
          body: Built from commit ${{ github.sha }}
          files: packages/*.deb
          make_latest: true
